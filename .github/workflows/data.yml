name: Build offline data
on: workflow_dispatch
permissions: { contents: write }
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: pip install osmium numpy
      - name: Download GCC extract and clip to Saudi Arabia
        run: |
          curl -L -o gcc.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          osmium extract -b 34.4,15.6,55.8,32.3 gcc.pbf -o ksa.pbf
      - run: python tools/build_data.py ksa.pbf
      - name: Publish release "data"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete data --cleanup-tag -y || true
          gh release create data ksa.graph places.db --title "offline data" --notes "Saudi road graph + place names"
